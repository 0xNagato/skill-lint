[project]
name = "skill-lint"
version = "0.1.0"
description = "Lint agent SKILL.md files and MCP tool schemas — catch the reasons skills and tools quietly never get used."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "ai-agents", "claude", "skills", "linter", "llm", "tooling"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
skill-lint = "skill_lint.cli:main"
skill-lint-mcp = "skill_lint.server:main"

[project.urls]
Homepage = "https://github.com/0xNagato/skill-lint"
Issues = "https://github.com/0xNagato/skill-lint/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_lint"]
